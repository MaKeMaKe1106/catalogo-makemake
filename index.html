<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Make - Catálogo Online</title>
    <!-- Importación de Tailwind CSS para el diseño visual responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ------------------------------------------------------------- */
        /* ESTILOS DEL CARRUSEL INFINITO                                 */
        /* ------------------------------------------------------------- */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: scroll 35s linear infinite;
        }
        /* Evita que la animación se detenga o falle al interactuar en móviles */
        .animate-marquee:active, .animate-marquee:focus {
            animation-play-state: running !important;
        }
        /* Clases auxiliares para ocultar barras de desplazamiento */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- ------------------------------------------------------------- -->
    <!-- CABECERA: LOGO Y BARRA DE BÚSQUEDA                             -->
    <!-- ------------------------------------------------------------- -->
    <header style="background: linear-gradient(135deg, #F5F2EB 0%, #E6E0D3 100%);" class="shadow-sm py-4 px-6 border-b border-gray-200">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-center gap-6 md:gap-10">
            <!-- Logo principal de la tienda -->
            <div class="flex flex-col items-center justify-center flex-shrink-0">
                <img src="https://lh3.googleusercontent.com/d/1YcfdcfiTwNAu45D-JX5plXMJ6oKOVOvy" alt="Make Make Logo" class="h-20 md:h-24 object-contain">
            </div>
            <!-- Input para buscar productos por nombre, marca o descripción -->
            <div class="w-full max-w-md">
                <div class="flex items-center bg-white rounded-full shadow-sm border border-gray-300 overflow-hidden focus-within:ring-2 focus-within:ring-pink-400 transition">
                    <span class="pl-4 pr-2 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="input-busqueda" placeholder="Buscar por nombre o marca..." class="w-full py-2.5 px-2 text-sm text-gray-700 bg-transparent focus:outline-none">
                </div>
            </div>
        </div>
    </header>

    <!-- ------------------------------------------------------------- -->
    <!-- BARRA DE MARCAS (CARRUSEL DINÁMICO SEGURO)                    -->
    <!-- ------------------------------------------------------------- -->
    <nav class="bg-white border-b border-gray-200 shadow-sm overflow-hidden py-6 relative">
        <div id="carrusel-contenedor">
            <!-- El carrusel se inyecta de forma segura aquí al cargar los datos -->
        </div>
    </nav>

    <!-- ------------------------------------------------------------- -->
    <!-- CUERPO PRINCIPAL: GRILLA DE PRODUCTOS                           -->
    <!-- ------------------------------------------------------------- -->
    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <!-- Aviso de filtro activo (aparece solo cuando filtras algo) -->
        <div id="filtro-activo-info" class="mb-6 flex justify-between items-center hidden">
            <p id="texto-filtro" class="text-sm font-semibold text-gray-600">Mostrando resultados.</p>
            <button onclick="reiniciarFiltros()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold transition">Ver todo el catálogo</button>
        </div>

        <!-- Cuadrícula con Skeletons (Tarjetas fantasma para carga visual instantánea en móviles) -->
        <div id="productos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm animate-pulse h-72">
                <div class="bg-gray-200 h-40 rounded-lg mb-4"></div>
                <div class="bg-gray-200 h-3 w-1/3 rounded mb-2"></div>
                <div class="bg-gray-200 h-4 w-3/4 rounded mb-4"></div>
                <div class="bg-gray-200 h-8 rounded"></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm animate-pulse h-72 hidden sm:block">
                <div class="bg-gray-200 h-40 rounded-lg mb-4"></div>
                <div class="bg-gray-200 h-3 w-1/3 rounded mb-2"></div>
                <div class="bg-gray-200 h-4 w-3/4 rounded mb-4"></div>
                <div class="bg-gray-200 h-8 rounded"></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm animate-pulse h-72 hidden md:block">
                <div class="bg-gray-200 h-40 rounded-lg mb-4"></div>
                <div class="bg-gray-200 h-3 w-1/3 rounded mb-2"></div>
                <div class="bg-gray-200 h-4 w-3/4 rounded mb-4"></div>
                <div class="bg-gray-200 h-8 rounded"></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm animate-pulse h-72 hidden lg:block">
                <div class="bg-gray-200 h-40 rounded-lg mb-4"></div>
                <div class="bg-gray-200 h-3 w-1/3 rounded mb-2"></div>
                <div class="bg-gray-200 h-4 w-3/4 rounded mb-4"></div>
                <div class="bg-gray-200 h-8 rounded"></div>
            </div>
        </div>
    </main>

    <!-- ------------------------------------------------------------- -->
    <!-- MODAL DE DETALLE DE PRODUCTO (VENTANA FLOTANTE)                 -->
    <!-- ------------------------------------------------------------- -->
    <div id="modal" onclick="cerrarModalAfuera(event)" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 relative shadow-2xl max-h-[90vh] flex flex-col my-auto">
            <!-- Botón de cerrar modal -->
            <button onclick="cerrarModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 font-bold text-2xl z-10 bg-white/80 px-2 rounded-full">&times;</button>
            
            <!-- Contenido deslizable del modal -->
            <div class="overflow-y-auto pr-2 no-scrollbar">
                <img id="modal-img" src="" alt="" class="w-full h-56 md:h-64 object-contain mb-4 rounded bg-gray-50 p-2">
                <h2 id="modal-titulo" class="text-xl font-bold mb-2 text-gray-900"></h2>
                <p id="modal-marca" class="text-xs uppercase bg-pink-100 text-pink-800 px-2.5 py-1 rounded-full inline-block mb-3 font-semibold"></p>
                <p id="modal-precio" class="text-xl font-extrabold mb-4" style="color: #4a88e5;"></p>
                <p id="modal-desc" class="text-sm text-gray-600 mb-4 leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- Estado de disponibilidad -->
            <div id="modal-estado" class="text-center font-bold py-2.5 rounded-lg text-sm tracking-wide mt-2 flex-shrink-0"></div>
        </div>
    </div>

    <!-- ------------------------------------------------------------- -->
    <!-- LÓGICA DE JAVASCRIPT                                          -->
    <!-- ------------------------------------------------------------- -->
    <script>
        // Enlace oficial de tu Apps Script conectado a Google Sheets
        const API_URL = 'https://script.google.com/macros/s/AKfycbxEJESltpmcuA53ow2D3ZcnLGMceypGhPjJMneOtgjOtaGd4fc94LJJXMmAgo_qvtUStg/exec';
        
        let todosLosProductos = []; 
        let productosFiltradosActuales = []; // Almacena la lista visible actual para evitar errores
        let marcaActual = 'TODAS';     
        let carruselCreado = false;    

        // Descarga los datos de Google Sheets
        async function cargarDatos() {
            try {
                let respuesta = await fetch(API_URL);
                todosLosProductos = await respuesta.json();
                productosFiltradosActuales = todosLosProductos;
                
                if (!carruselCreado) {
                    construirCarruselConLogos(todosLosProductos);
                    carruselCreado = true;
                }
                
                renderizarProductos(todosLosProductos);
            } catch (error) {
                console.error("Error al cargar los datos:", error);
                document.getElementById('productos-grid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500 font-medium">Error al cargar los productos. Intenta recargar la página.</div>`;
            }
        }

        // Activador del buscador de texto en tiempo real
        document.addEventListener("DOMContentLoaded", () => {
            const inputBusqueda = document.getElementById("input-busqueda");
            if (inputBusqueda) {
                inputBusqueda.addEventListener("input", () => {
                    aplicarFiltros();
                });
            }
        });

        // Construye el carrusel asegurando nombres limpios y un mapeo de marcas confiable
        function construirCarruselConLogos(productos) {
            const contenedorNav = document.getElementById('carrusel-contenedor');
            
            let marcasMap = {};
            productos.forEach(p => {
                if (p.marca) {
                    let nombreMarcaLimpio = String(p.marca).trim().toUpperCase();
                    if (!marcasMap[nombreMarcaLimpio]) {
                        marcasMap[nombreMarcaLimpio] = p.logo_marca || '';
                    }
                }
            });

            // Ordenamos alfabéticamente para mantener siempre la misma posición en celulares
            let marcasArray = Object.keys(marcasMap).sort();

            let htmlTodos = `<div onclick="seleccionarMarca('TODAS')" class="cursor-pointer flex-shrink-0 px-5 py-2.5 bg-pink-50 hover:bg-pink-100 rounded-lg text-pink-900 font-bold text-xs uppercase tracking-wider transition">TODAS</div>`;

            let itemsHTML = marcasArray.map(marcaOriginal => {
                let logoUrl = marcasMap[marcaOriginal];
                let marcaLower = marcaOriginal.toLowerCase();

                let alturaContenedor = "h-16"; 
                let espacioHorizontal = "px-6"; 
                let escalaZoom = "transform: scale(1.4);"; 

                if (marcaLower.includes('round lab') || marcaLower.includes('centellian')) {
                    escalaZoom = "transform: scale(2.2);"; 
                } 
                else if (marcaLower.includes('skin1004')) {
                    escalaZoom = "transform: scale(2.4);"; 
                }
                else if (marcaLower.includes('dr. althea')) {
                    escalaZoom = "transform: scale(5.0);";
                } 
                else if (marcaLower.includes('medicube') || marcaLower.includes('mixsoon')) {
                    escalaZoom = "transform: scale(1.6);"; 
                }
                else if (marcaLower.includes('job') || marcaLower.includes('k-secret')) {
                    escalaZoom = "transform: scale(0.8);"; 
                }
                else if (marcaLower.includes('anua') || marcaLower.includes('arencia') || marcaLower.includes('beauty creations')) {
                    escalaZoom = "transform: scale(1.2);"; 
                }

                // Pasamos la marca limpia evitando errores de comillas
                let marcaEscapada = marcaOriginal.replace(/'/g, "\\'");
                if (!logoUrl) {
                    return `<div onclick="seleccionarMarca('${marcaEscapada}')" class="cursor-pointer flex-shrink-0 text-gray-700 font-bold text-sm tracking-wider uppercase hover:text-pink-600 transition">${marcaOriginal}</div>`;
                } else {
                    return `<div onclick="seleccionarMarca('${marcaEscapada}')" class="cursor-pointer flex-shrink-0 ${alturaContenedor} flex items-center justify-center ${espacioHorizontal} transition transform hover:scale-105">
                                <img src="${logoUrl}" alt="${marcaOriginal}" style="${escalaZoom}" class="h-16 md:h-20 max-w-[220px] object-contain transition duration-300" loading="lazy">
                            </div>`;
                }
            }).join('');

            // Duplicamos el contenido para garantizar el scroll infinito continuo
            contenedorNav.innerHTML = `
                <div class="animate-marquee flex items-center space-x-14 px-6">
                    ${htmlTodos}${itemsHTML}${itemsHTML}
                </div>
            `;
        }

        // Selecciona la marca exacta sin errores de coincidencia
        function seleccionarMarca(marca) {
            marcaActual = String(marca).trim().toUpperCase();
            document.getElementById('input-busqueda').value = ''; 
            aplicarFiltros();
        }

        // Aplica los filtros de búsqueda y marca
        function aplicarFiltros() {
            let textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase().trim();
            let filtrados = todosLosProductos;

            if (marcaActual !== 'TODAS') {
                filtrados = filtrados.filter(p => String(p.marca || '').trim().toUpperCase() === marcaActual);
            }

            if (textoBusqueda !== '') {
                const normalizar = (str) => (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                let busquedaLimpia = normalizar(textoBusqueda);

                filtrados = filtrados.filter(p => {
                    let nombre = normalizar(p.nombre);
                    let marca = normalizar(p.marca);
                    let desc = normalizar(p.descripcion);
                    return nombre.includes(busquedaLimpia) || marca.includes(busquedaLimpia) || desc.includes(busquedaLimpia);
                });
            }

            productosFiltradosActuales = filtrados;
            renderizarProductos(filtrados);

            const infoFiltro = document.getElementById('filtro-activo-info');
            const textoFiltro = document.getElementById('texto-filtro');
            if (marcaActual !== 'TODAS' || textoBusqueda !== '') {
                textoFiltro.innerText = `Resultados filtrados (${filtrados.length} productos encontrados)`;
                infoFiltro.classList.remove('hidden');
            } else {
                infoFiltro.classList.add('hidden');
            }
        }

        // Restablece los filtros
        function reiniciarFiltros() {
            marcaActual = 'TODAS';
            document.getElementById('input-busqueda').value = '';
            productosFiltradosActuales = todosLosProductos;
            renderizarProductos(todosLosProductos);
            document.getElementById('filtro-activo-info').classList.add('hidden');
        }

        // Renderiza las tarjetas de productos de forma segura usando índices numéricos
        function renderizarProductos(productos) {
            const grid = document.getElementById('productos-grid');
            
            if (productos.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium">No se encontraron productos con esos criterios.</div>`;
                return;
            }

            // Usamos el índice (index) para evitar que caracteres especiales o comillas rompan el HTML en móviles
            grid.innerHTML = productos.map((p, index) => {
                let esAgotado = p.estado && p.estado.toLowerCase() === 'agotado';
                return `
                    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col justify-between relative hover:shadow-md transition">
                        ${esAgotado ? '<span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-md shadow">AGOTADO</span>' : ''}
                        <div class="p-4 flex justify-center bg-gray-50 h-48">
                            <img src="${p.imagen}" alt="${p.nombre}" class="h-full object-contain" loading="lazy">
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <span class="text-[10px] uppercase font-bold mb-1" style="color: #4a88e5;">${p.marca}</span>
                            <h3 class="font-semibold text-sm mb-2 text-gray-800 line-clamp-2">${p.nombre}</h3>
                            <p class="text-base font-bold text-gray-900 mt-auto mb-3">S/. ${p.precio}</p>
                            <button onclick="abrirModalPorIndex(${index})" class="w-full py-2 bg-pink-50 text-pink-900 rounded-lg text-xs font-bold hover:bg-pink-600 hover:text-white transition">
                                Ver detalle
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Abre el modal de detalles de manera 100% segura mediante el índice de la lista actual
        function abrirModalPorIndex(index) {
            let p = productosFiltradosActuales[index];
            if (!p) return;

            document.getElementById('modal-img').src = p.imagen;
            document.getElementById('modal-titulo').innerText = p.nombre;
            document.getElementById('modal-marca').innerText = p.marca;
            document.getElementById('modal-precio').innerText = 'S/. ' + p.precio;
            document.getElementById('modal-desc').innerText = p.descripcion;
            
            let estadoDiv = document.getElementById('modal-estado');
            let esAgotado = p.estado && p.estado.toLowerCase() === 'agotado';
            if(esAgotado) {
                estadoDiv.innerText = "PRODUCTO AGOTADO";
                estadoDiv.className = "text-center font-bold py-2.5 rounded-lg text-sm bg-red-100 text-red-700 tracking-wide mt-2 flex-shrink-0";
            } else {
                estadoDiv.innerText = "DISPONIBLE";
                estadoDiv.className = "text-center font-bold py-2.5 rounded-lg text-sm bg-emerald-100 text-emerald-700 tracking-wide mt-2 flex-shrink-0";
            }

            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        // Cierra el modal
        function cerrarModal() {
            document.getElementById('modal').classList.remove('flex');
            document.getElementById('modal').classList.add('hidden');
        }

        // Cierra el modal al hacer clic fuera
        function cerrarModalAfuera(event) {
            const modalDiv = document.getElementById('modal');
            if (event.target === modalDiv) {
                cerrarModal();
            }
        }

        // Carga inicial
        cargarDatos();
    </script>
</body>
</html>
